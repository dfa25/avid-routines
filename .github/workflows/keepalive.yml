name: Keepalive

# GitHub disables scheduled workflows after 60 days with no repository activity.
# The report workflows commit their snapshots to avid-routines-data, not here,
# so nothing ever resets that clock and every schedule silently dies. This empty
# monthly commit resets it. Do not delete.

on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of the month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit to reset the inactivity timer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive, reset the 60-day schedule timer"
          git push
